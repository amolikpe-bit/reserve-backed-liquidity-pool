[workspace]
resolver = "2"
members = ["contracts/pool", "contracts/mock-ft"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/nirholas/near-krater"

[workspace.metadata]
name = "krater"

[workspace.dependencies]
near-sdk = "5.30.2"
near-sdk-contract-tools = "4.0.0"
near-contract-standards = "5.30.2"
primitive-types = { version = "=0.14.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
debug = false
panic = "abort"
overflow-checks = true
